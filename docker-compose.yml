services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: m68
      POSTGRES_PASSWORD: m68
      POSTGRES_DB: m68
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m68"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  platform:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://m68:m68@postgres:5432/m68
      SYNC_DATABASE_URL: postgresql+psycopg2://m68:m68@postgres:5432/m68
      REDIS_URL: redis://redis:6379/0
    ports:
      - "7808:7808"     # JT/T 808 TCP for terminals
      - "8000:8000"     # REST API
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - platform

volumes:
  pgdata:
