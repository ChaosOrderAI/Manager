server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理到 platform 容器
    location /api/ {
        proxy_pass http://platform:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /health {
        proxy_pass http://platform:8000/health;
    }
    location /docs {
        proxy_pass http://platform:8000/docs;
    }
    location /openapi.json {
        proxy_pass http://platform:8000/openapi.json;
    }
}
